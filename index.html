<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>HomeCore Construction</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20x%3D'2'%20y%3D'2'%20width%3D'96'%20height%3D'96'%20rx%3D'22'%20fill%3D'%230D1F3C'%2F%3E%3Cpath%20d%3D'M50%2024%20L80%2048%20L80%2080%20L20%2080%20L20%2048%20Z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M50%2024%20L80%2048%20L72%2048%20L50%2033%20Z'%20fill%3D'%239AA3B2'%2F%3E%3Crect%20x%3D'43'%20y%3D'58'%20width%3D'14'%20height%3D'22'%20fill%3D'%230D1F3C'%2F%3E%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0D1F3C;
      --navy-soft: #1E3A5F;
      --gray-light: #9AA3B2;
      --white: #FFFFFF;
      --rule: rgba(255,255,255,0.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .logo span.wordmark {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: var(--white);
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gray-light);
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(34px, 6vw, 48px);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      line-height: 1.75;
      color: var(--gray-light);
    }
    .divider {
      width: 56px;
      height: 3px;
      background: var(--navy-soft);
      margin: 28px auto 0;
      border-radius: 2px;
    }
    footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--gray-light);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="22" fill="#ffffff"/><path d="M50 24 L80 48 L80 80 L20 80 L20 48 Z" fill="#0D1F3C"/><path d="M50 24 L80 48 L72 48 L50 33 Z" fill="#1E3A5F"/><rect x="43" y="58" width="14" height="22" fill="#ffffff"/></svg>
      <span class="wordmark">Home<span style="color:#9AA3B2;">Core</span> Construction</span>
    </div>
    <div class="eyebrow">Long Island, New York</div>
    <h1>Something solid is taking shape.</h1>
    <p>Our new website is under construction, and we're building it the same way we build everything: carefully, and done right the first time. Check back soon.</p>
    <div class="divider"></div>
    <footer>&copy; 2026 HomeCore Construction. All rights reserved.</footer>
  </main>
</body>
</html>
